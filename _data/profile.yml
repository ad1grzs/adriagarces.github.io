intro:
  - "I am a PhD student in Physics at the Universitat de Barcelona. My research focuses on active matter, in particular active Brownian particles and non-reciprocal interactions."
  - "I also work on equilibrium and non-equilibrium statistical mechanics, and on mathematics applied to theoretical physics."
  - "This website gathers my materials, both to share them and to keep my own work organised. Feel free to get in touch."

