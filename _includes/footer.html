<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <p class="footer-name">{{ site.data.profile.name }}</p>
      <p class="footer-meta">{{ site.data.profile.affiliation }} · Barcelona</p>
    </div>

    <ul class="footer-links">
      {% for link in site.data.profile.links %}
      <li><a href="{{ link.url }}">{{ link.label }}</a></li>
      {% endfor %}
      <li><a href="{{ site.repo_url }}">Source</a></li>
    </ul>

    <a class="to-top" href="#home">Back to top ↑</a>
  </div>
  <p class="container copyright">© {{ 'now' | date: "%Y" }} {{ site.data.profile.name }}</p>
</footer>
